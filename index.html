<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KriyaCost - Nata Rasa, Ngukir Cita</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans">

  <!-- Header / Navbar -->
  <header class="bg-[#2e236c] text-white shadow-md sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between items-center h-16">
      <div class="flex items-center space-x-3">
        <!-- Ganti 'logo.png' jika nama file gambar logomu di GitHub berbeda -->
        <img src="logo.png" onerror="this.style.display='none'; document.getElementById('fallback-logo').style.display='flex';" alt="Logo KriyaCost" class="h-10 w-10 object-contain rounded-lg bg-white/10 p-1">
        <div id="fallback-logo" style="display:none;" class="h-10 w-10 rounded-lg bg-amber-400/20 text-amber-400 items-center justify-center text-xl">
          <i class="fa-solid fa-calculator"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-tight text-white leading-tight">KriyaCost</h1>
          <p class="text-xs text-indigo-200 italic">Nata Rasa, Ngukir Cita</p>
        </div>
      </div>
      
      <!-- Indikator Koneksi -->
      <div id="connection-badge" class="flex items-center space-x-2 text-xs bg-indigo-950/60 border border-indigo-500/30 px-3 py-1.5 rounded-full">
        <span id="connection-dot" class="inline-block w-2.5 h-2.5 rounded-full bg-amber-400 animate-pulse"></span>
        <span id="connection-text" class="font-medium text-indigo-100">Memeriksa Koneksi...</span>
      </div>
    </div>
  </header>

  <!-- Navigation Tabs -->
  <div class="bg-white border-b border-gray-200 sticky top-16 z-20 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <nav class="flex space-x-6 sm:space-x-8 overflow-x-auto" aria-label="Tabs">
        <button type="button" onclick="switchTab('tab-dashboard')" id="btn-tab-dashboard" class="tab-btn border-b-2 border-[#2e236c] py-4 px-1 text-sm font-semibold text-[#2e236c] flex items-center space-x-2 whitespace-nowrap cursor-pointer">
          <i class="fa-solid fa-chart-pie"></i>
          <span>Dashboard & Analisis</span>
        </button>
        <button type="button" onclick="switchTab('tab-pelanggan')" id="btn-tab-pelanggan" class="tab-btn border-b-2 border-transparent py-4 px-1 text-sm font-medium text-gray-500 hover:text-gray-700 hover:border-gray-300 flex items-center space-x-2 whitespace-nowrap cursor-pointer">
          <i class="fa-solid fa-users"></i>
          <span>Kelola Pelanggan</span>
        </button>
        <button type="button" onclick="switchTab('tab-pesanan')" id="btn-tab-pesanan" class="tab-btn border-b-2 border-transparent py-4 px-1 text-sm font-medium text-gray-500 hover:text-gray-700 hover:border-gray-300 flex items-center space-x-2 whitespace-nowrap cursor-pointer">
          <i class="fa-solid fa-receipt"></i>
          <span>Job Orders (Pesanan)</span>
        </button>
      </nav>
    </div>
  </div>

  <!-- Main Content Container -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full">

    <!-- ==================== TAB 1: DASHBOARD ==================== -->
    <section id="tab-dashboard" class="tab-content block space-y-6">
      
      <!-- Ringkasan Kartu Metrik Keuangan -->
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center space-x-4">
          <div class="w-12 h-12 rounded-xl bg-indigo-50 text-[#2e236c] flex items-center justify-center text-xl">
            <i class="fa-solid fa-wallet"></i>
          </div>
          <div>
            <p class="text-xs font-medium text-slate-500 uppercase tracking-wider">Total Pendapatan</p>
            <h4 id="stat-total-revenue" class="text-xl font-bold text-slate-800">Rp 0</h4>
          </div>
        </div>

        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center space-x-4">
          <div class="w-12 h-12 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center text-xl">
            <i class="fa-solid fa-boxes-stacked"></i>
          </div>
          <div>
            <p class="text-xs font-medium text-slate-500 uppercase tracking-wider">Total Pesanan</p>
            <h4 id="stat-total-orders" class="text-xl font-bold text-slate-800">0</h4>
          </div>
        </div>

        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center space-x-4">
          <div class="w-12 h-12 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-xl">
            <i class="fa-solid fa-chart-line"></i>
          </div>
          <div>
            <p class="text-xs font-medium text-slate-500 uppercase tracking-wider">Kelayakan (BCR)</p>
            <h4 class="text-xl font-bold text-emerald-600">24.25x</h4>
          </div>
        </div>

        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center space-x-4">
          <div class="w-12 h-12 rounded-xl bg-blue-50 text-blue-600 flex
